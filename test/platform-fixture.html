<!doctype html>
<html lang="ru">
<body>
  <label>1а. Отправитель (наименование, адрес, страна)<textarea id="exporter"></textarea></label>
  <label>Язык сертификата<select id="language"><option>Русский</option><option>Английский</option></select></label>
  <label>2а. Получатель (наименование, адрес, страна)<textarea id="consignee"></textarea></label>
  <label>3. Вид транспорта и маршрут<textarea id="transport"></textarea></label>
  <label>4. Для служебных отметок<textarea id="official"></textarea></label>
  <label>5. Страна происхождения<textarea id="origin"></textarea></label>
  <label>6. Дополнительные сведения<textarea id="supplementary"></textarea></label>
  <section>
    <label>8. Описание товара<textarea id="description-1"></textarea></label>
    <label>9. Количество мест<input id="package-count-1"></label>
    <label>9. Вид упаковки<input id="package-type-1"></label>
    <label>10. Gross weight<input id="gross-1"></label>
    <label>10. Net weight<input id="net-1"></label>
  </section>
  <label>Импортирующая страна<input id="importing-country"></label>
  <label>Место заявления, город<input id="place"></label>
  <label>Дата (дд.мм.гггг)<input id="date"></label>
  <button>Сохранить</button>
</body>
</html>
